services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: adspend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/adspend
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: production-secret-change-me
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/adspend
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
